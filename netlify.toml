# College ReadyAI on Netlify.
#
# Set the two NEXT_PUBLIC_* values in Netlify under Site configuration ->
# Environment variables, not here: this file is committed.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
